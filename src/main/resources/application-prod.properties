spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

server.port=${PORT:8080}

spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
brevo.api.key=${BREVO_API_KEY}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.debug=true

gemini.api.key=${GEMINI_API_KEY}

aws.region=${AWS_REGION}
aws.s3.bucket=${AWS_S3_BUCKET}
aws.accessKey=${AWS_ACCESS_KEY}
aws.secretKey=${AWS_SECRET_KEY}

s3.presign.upload.expiryMinutes=5
s3.presign.download.expiryMinutes=5

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Where uploaded canteen images/certs/menus/committee photos are written.
# IMPORTANT: Render's free/starter web service disk is ephemeral — files
# written here are lost on every redeploy or restart. Set UPLOAD_DIR to a
# Render persistent disk mount if you add one, or migrate this to the
# S3Service already used for complaint attachments for durable storage.
app.upload.dir=${UPLOAD_DIR:uploads}

spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.preferQueryMode=simple